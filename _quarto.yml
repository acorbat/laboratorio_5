project:
  type: website
  output-dir: docs
  resources:
    - materials/**
    - assets/**

website:
  title: "Laboratorio 5"
  description: "Repositorio de material docente y de cursada"
  sidebar:
    - id: experimentos
      title: "Experimentos"
      style: "docked"
      search: false
      collapse-level: 1
      contents:
        - experimentos/index.qmd
        - experimentos/conteo-fotones.qmd
        - experimentos/descarga-glow.qmd
        - experimentos/fotoelectrico.qmd
        - experimentos/espectroscopia-difractiva.qmd
        - experimentos/espectroscopia-zeeman.qmd
        - experimentos/fluidos.qmd
        - experimentos/laser.qmd
        - experimentos/muones.qmd
        - experimentos/nuclear.qmd
        - experimentos/faraday.qmd
  navbar:
    left:
      - text: Inicio
        href: index.qmd
      - text: Experimentos
        href: experimentos/index.qmd
      - text: Seguridad
        href: seguridad/index.qmd
      - text: Material adicional
        href: material-adicional/index.qmd
      - text: Manuales
        href: manuales/index.qmd
      - text: Estado de materiales
        href: estado-materiales/index.qmd
  page-footer:
    left: "Laboratorio 5 — Departamento de Física"
    center: "<img src='assets/logo_df.jpg' alt='Logo DF' style='height:40px; width:auto; vertical-align:middle; margin-right:10px;'/>"
    right: "Sitio generado con Quarto"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    lang: es
    date: last-modified
    date-format: "DD/MM/YYYY"
